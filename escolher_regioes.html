<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Regiões — escolher lendário</title>
<style>
  :root{--bg:#0e0e18;--card:#1a1a28;--line:#2a2a40;--txt:#eef0f8;--dim:#9aa0bb;--accent:#e94560;--gold:#ffd56b}
  *{box-sizing:border-box} body{margin:0;background:radial-gradient(120% 80% at 50% -5%,#222a4c,#0c0d16 60%);color:var(--txt);font-family:system-ui,Segoe UI,Roboto,sans-serif}
  header{position:sticky;top:0;z-index:10;background:#11121dee;backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:12px 18px}
  h1{margin:0;font-size:1.1rem} header p{margin:4px 0 8px;color:var(--dim);font-size:.82rem;max-width:920px}
  .rule{display:flex;gap:14px;flex-wrap:wrap;font-size:.76rem;color:var(--dim);margin-bottom:8px}.rule b{color:var(--gold)}
  .barrow{display:flex;align-items:center;gap:10px} .bar{flex:1;height:8px;background:#222;border-radius:6px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .3s}.prog{font-size:.8rem;color:var(--dim)}
  .copy{background:var(--accent);border:0;color:#fff;padding:7px 14px;border-radius:8px;font-weight:600;cursor:pointer;font-size:.82rem}
  textarea{width:100%;height:150px;background:#0e0e16;color:#bfe;border:1px solid var(--line);border-radius:8px;padding:10px;font-family:monospace;font-size:.76rem;margin-top:8px;display:none}textarea.show{display:block}
  main{max-width:1080px;margin:0 auto;padding:14px 16px 80px}
  .tblock{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px}
  .thead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:4px}
  .pill{color:#0e0e18;font-weight:800;padding:3px 12px;border-radius:20px;font-size:.85rem}.chosen{font-size:.74rem;color:#7CFC9B}
  .thr{font-size:.72rem;color:var(--dim);margin-bottom:8px}
  .sublabel{font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:6px 0 2px}
  .opts{display:flex;gap:6px;flex-wrap:wrap}.more-opts{display:none}.more-opts.open{display:flex}
  .optT{cursor:pointer;border:2px solid transparent;border-radius:12px;padding:2px 4px;text-align:center}
  .optT:hover{border-color:#3a3a55}.optT.sel{border-color:var(--gold);background:#221f12}.optT.dup{opacity:.4}
  .optT svg{width:104px;height:150px;display:block}
  .lbl{font-size:.68rem;font-weight:600;max-width:104px;text-transform:capitalize}
  .more{margin-top:8px;background:none;border:0;color:var(--accent);cursor:pointer;font-size:.8rem;padding:0}
  .prog-strip{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;border-top:1px dashed var(--line);padding-top:8px}
  .pcell{text-align:center} .pcell svg{width:96px;height:140px;display:block} .pc-cap{font-size:.68rem;font-weight:700}.pc-sub{font-size:.62rem;color:var(--dim)}
  .diamond svg{filter:drop-shadow(0 0 7px rgba(168,85,222,.6))}
</style></head><body>
<header>
  <h1>🗺️ Regiões — escolha o lendário/raro de cada uma</h1>
  <p>Cada região = um troféu com um Pokémon lendário/raro dentro da esfera (cor da região). A #1 já vem marcada; "ver todas" mostra mais opções. Tier por % de captura da região.</p>
  <div class="rule"><span>🥉 <b>Bronze</b> = 25%</span><span>🥈 <b>Prata</b> = 50%</span><span>🥇 <b>Ouro</b> = 75%</span><span>💎 <b>Diamante</b> = 100%</span></div>
  <div class="barrow"><div class="bar"><div class="fill" id="fill"></div></div><span class="prog" id="prog">0/10</span><button class="copy" onclick="copyChoices()">copiar escolhas</button></div>
  <textarea id="out" readonly></textarea>
</header>

<svg width="0" height="0" style="position:absolute"><defs id="defs">
  <linearGradient id="m-bronze" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4d3a0"/><stop offset=".3" stop-color="#d68f44"/><stop offset=".62" stop-color="#a5601f"/><stop offset="1" stop-color="#6b3a12"/></linearGradient>
  <linearGradient id="m-silver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".3" stop-color="#e3e9f2"/><stop offset=".6" stop-color="#aab3c2"/><stop offset="1" stop-color="#6f7889"/></linearGradient>
  <linearGradient id="m-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6cf"/><stop offset=".28" stop-color="#ffd84d"/><stop offset=".55" stop-color="#e7a51f"/><stop offset=".8" stop-color="#b3760f"/><stop offset="1" stop-color="#7a4d08"/></linearGradient>
  <linearGradient id="m-diamond" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1d8ff"/><stop offset=".28" stop-color="#c186ee"/><stop offset=".58" stop-color="#8a3fc0"/><stop offset=".82" stop-color="#5e2393"/><stop offset="1" stop-color="#3a1060"/></linearGradient>
  <radialGradient id="spec" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <radialGradient id="coreGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#9fb6ff" stop-opacity=".16"/><stop offset="1" stop-color="#9fb6ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="innerShade" cx=".5" cy=".82" r=".6"><stop offset="0" stop-color="#000" stop-opacity=".38"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a4470"/><stop offset=".5" stop-color="#212949"/><stop offset="1" stop-color="#0e1324"/></linearGradient>
  <linearGradient id="cylDark" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".45"/><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".5"/></linearGradient>
  <linearGradient id="cylLight" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".42" stop-color="#fff" stop-opacity=".14"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.2"/></filter>
  <filter id="ds" x="-30%" y="-25%" width="160%" height="155%"><feDropShadow dx="0" dy="3" stdDeviation="3.2" flood-color="#000" flood-opacity=".5"/></filter>
  <clipPath id="orbClip"><circle cx="75" cy="66" r="40"/></clipPath>
</defs></svg>

<main id="root"></main>
<script>
const ART = n=>`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${n}.png`;
const L=(n,nm)=>({n,nm});
const REGIONS = [
  {nm:'Kanto',total:151,color:'#e0533a',opts:[L(150,'Mewtwo'),L(144,'Articuno'),L(145,'Zapdos'),L(146,'Moltres'),L(151,'Mew'),L(149,'Dragonite')]},
  {nm:'Johto',total:100,color:'#d4a82b',opts:[L(250,'Ho-Oh'),L(249,'Lugia'),L(245,'Suicune'),L(243,'Raikou'),L(244,'Entei'),L(251,'Celebi')]},
  {nm:'Hoenn',total:135,color:'#2fae5e',opts:[L(384,'Rayquaza'),L(382,'Kyogre'),L(383,'Groudon'),L(380,'Latias'),L(381,'Latios'),L(386,'Deoxys')]},
  {nm:'Sinnoh',total:107,color:'#4a78c0',opts:[L(483,'Dialga'),L(484,'Palkia'),L(487,'Giratina'),L(491,'Darkrai'),L(445,'Garchomp'),L(493,'Arceus')]},
  {nm:'Unova',total:156,color:'#6b7280',opts:[L(643,'Reshiram'),L(644,'Zekrom'),L(646,'Kyurem'),L(494,'Victini'),L(635,'Hydreigon')]},
  {nm:'Kalos',total:72,color:'#3f74d6',opts:[L(716,'Xerneas'),L(717,'Yveltal'),L(718,'Zygarde'),L(706,'Goodra')]},
  {nm:'Alola',total:88,color:'#f29440',opts:[L(791,'Solgaleo'),L(792,'Lunala'),L(800,'Necrozma'),L(785,'Tapu Koko'),L(784,'Kommo-o')]},
  {nm:'Galar',total:89,color:'#7b46c9',opts:[L(888,'Zacian'),L(889,'Zamazenta'),L(890,'Eternatus'),L(887,'Dragapult')]},
  {nm:'Hisui',total:7,color:'#9a7a52',opts:[L(905,'Enamorus'),L(899,'Wyrdeer'),L(903,'Sneasler'),L(901,'Ursaluna'),L(900,'Kleavor')]},
  {nm:'Paldea',total:120,color:'#d23b6a',opts:[L(1007,'Koraidon'),L(1008,'Miraidon'),L(1002,'Chien-Pao'),L(1003,'Ting-Lu'),L(1004,'Chi-Yu'),L(1001,'Wo-Chien')]},
];
const slug = s => s.toLowerCase();
function mix(hex,w,t){const a=parseInt(hex.slice(1),16),r=(a>>16)&255,g=(a>>8)&255,b=a&255;const a2=parseInt(w.slice(1),16),r2=(a2>>16)&255,g2=(a2>>8)&255,b2=a2&255;const R=Math.round(r+(r2-r)*t),G=Math.round(g+(g2-g)*t),B=Math.round(b+(b2-b)*t);return '#'+((1<<24)+(R<<16)+(G<<8)+B).toString(16).slice(1);}
const defs=document.getElementById('defs');
REGIONS.forEach(r=>defs.insertAdjacentHTML('beforeend',`<radialGradient id="o-${slug(r.nm)}" cx=".38" cy=".3" r=".85"><stop offset="0" stop-color="${mix(r.color,'#ffffff',.6)}"/><stop offset=".45" stop-color="${r.color}"/><stop offset="1" stop-color="${mix(r.color,'#000000',.5)}"/></radialGradient>`));

function stand(metal){return `
  <ellipse cx="75" cy="194" rx="52" ry="7.5" fill="#000" opacity=".42" filter="url(#soft)"/>
  <path d="M40,172 L110,172 L105,185 A33,7 0 0 1 45,185 Z" fill="${metal}"/><ellipse cx="75" cy="185" rx="32.5" ry="6.5" fill="#000" opacity=".22"/>
  <ellipse cx="75" cy="172" rx="35" ry="8.5" fill="${metal}"/><ellipse cx="68" cy="170" rx="16" ry="3" fill="#fff" opacity=".35"/>
  <path d="M45,135 L105,135 L102,170 A30,8 0 0 1 48,170 Z" fill="url(#stone)"/><path d="M45,135 L105,135 L102,170 A30,8 0 0 1 48,170 Z" fill="url(#cylDark)"/><path d="M45,135 L105,135 L102,170 A30,8 0 0 1 48,170 Z" fill="url(#cylLight)"/>
  <g stroke-linecap="round"><line x1="57" y1="139" x2="56" y2="167" stroke="#000" stroke-opacity=".26" stroke-width="1.6"/><line x1="93" y1="139" x2="94" y2="167" stroke="#000" stroke-opacity=".26" stroke-width="1.6"/></g>
  <ellipse cx="75" cy="135" rx="30" ry="7.5" fill="${metal}"/><ellipse cx="75" cy="135" rx="24" ry="5.4" fill="#0e1324"/><ellipse cx="71" cy="133.5" rx="13" ry="2.4" fill="#fff" opacity=".4"/>
  <rect x="53" y="147" width="44" height="15" rx="3" fill="#0b0f1c"/><rect x="53" y="147" width="44" height="15" rx="3" fill="none" stroke="${metal}" stroke-width="1.6"/>
  <path d="M75,150.5 l4.6,3.3 -4.6,5 -4.6,-5 z" fill="${metal}"/><path d="M75,150.5 l4.6,3.3 -4.6,2 -4.6,-2 z" fill="#fff" opacity=".55"/>
  <path d="M66,112 L84,112 C83,122 88,128 97,134 L53,134 C62,128 67,122 66,112 Z" fill="${metal}"/>
  <ellipse cx="75" cy="110" rx="15" ry="4.6" fill="${metal}"/><ellipse cx="75" cy="113" rx="13" ry="3.8" fill="${metal}"/><ellipse cx="75" cy="116" rx="11" ry="3.2" fill="${metal}"/>`;}
function sparkle(x,y,s){s=s||1;const a=4.2*s,b=1.2*s;return `<g transform="translate(${x} ${y})" opacity=".92"><path d="M0,${-a} L${b},0 L0,${a} L${-b},0 Z" fill="#fff"/><path d="M${-a},0 L0,${b} L${a},0 L0,${-b} Z" fill="#fff"/></g>`;}
function laurel(metal){const cx=75,cy=66;let s='';const br=(a0,a1,n)=>{for(let i=0;i<n;i++){const t=i/(n-1),a=(a0+(a1-a0)*t)*Math.PI/180,x=cx+50*Math.cos(a),y=cy+50*Math.sin(a),rot=a*180/Math.PI+90;s+=`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="7" ry="2.7" fill="${metal}" transform="rotate(${rot.toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)})"/>`;}};br(120,250,6);br(60,-70,6);return s;}
function orb(glass,metal,img){let core='';if(img)core=`<image href="${img}" x="37" y="29" width="76" height="76" clip-path="url(#orbClip)" preserveAspectRatio="xMidYMid meet" onerror="this.remove()"/>`;
  let st='';for(let i=0;i<10;i++){const a=(i/10)*Math.PI*2-Math.PI/2,x=75+44*Math.cos(a),y=66+44*Math.sin(a);st+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.3" fill="${metal}"/><circle cx="${(x-.5).toFixed(1)}" cy="${(y-.6).toFixed(1)}" r=".85" fill="#fff" opacity=".75"/>`;}
  return `<circle cx="75" cy="66" r="44" fill="${glass}"/><ellipse cx="75" cy="70" rx="30" ry="27" fill="url(#coreGlow)"/>${core}<ellipse cx="75" cy="93" rx="33" ry="19" fill="url(#innerShade)"/>
  <path d="M41,80 A44,44 0 0 0 109,80" fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="3.5"/>
  <circle cx="75" cy="66" r="44" fill="none" stroke="${metal}" stroke-width="7.5"/><circle cx="75" cy="66" r="47.8" fill="none" stroke="#000" stroke-opacity=".3" stroke-width="1.2"/><circle cx="75" cy="66" r="40.2" fill="none" stroke="#000" stroke-opacity=".35" stroke-width="1.2"/>
  <path d="M45,54 A44,44 0 0 1 84,29" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2.4" stroke-linecap="round"/>${st}<ellipse cx="61" cy="47" rx="18" ry="12" fill="url(#spec)" transform="rotate(-25 61 47)"/><circle cx="55" cy="44" r="3.2" fill="#fff" opacity=".85"/>${sparkle(96,40,1)}${sparkle(58,86,.7)}`;}
function trophy(tier,rslug,img){const metal=`url(#m-${tier})`;return `<svg viewBox="0 0 150 210"><ellipse cx="75" cy="64" rx="66" ry="76" fill="url(#glow)"/><g filter="url(#ds)">${stand(metal)}${laurel(metal)}${orb(`url(#o-${rslug})`,metal,img)}</g></svg>`;}

const TIERS=[['bronze','Bronze'],['silver','Prata'],['gold','Ouro'],['diamond','Diamante']];
const sel={};
function renderProg(r){const o=r.opts[sel[slug(r.nm)]]||r.opts[0];const thr=[Math.ceil(r.total*.25),Math.ceil(r.total*.5),Math.ceil(r.total*.75),r.total];
  return TIERS.map((tr,i)=>`<div class="pcell ${tr[0]==='diamond'?'diamond':''}">${trophy(tr[0],slug(r.nm),ART(o.n))}<div class="pc-cap">${tr[1]}</div><div class="pc-sub">≥ ${thr[i]}${i===3?' (100%)':''}</div></div>`).join('');}
function render(){
  document.getElementById('root').innerHTML = REGIONS.map(r=>{
    const sg=slug(r.nm), thr=[Math.ceil(r.total*.25),Math.ceil(r.total*.5),Math.ceil(r.total*.75),r.total];
    const rec=r.opts.slice(0,2), rest=r.opts.slice(2);
    const optCard=(o,oi)=>`<div class="optT" data-sg="${sg}" data-i="${oi}" data-key="${o.n}" onclick="pick('${sg}',${oi})">${trophy('gold',sg,ART(o.n))}<div class="lbl">${o.nm}</div></div>`;
    return `<div class="tblock"><div class="thead"><div><span class="pill" style="background:${r.color}">${r.nm}</span> <span class="chosen" id="tag-${sg}"></span></div></div>
      <div class="thr">${r.total} Pokémon · 🥉≥${thr[0]} · 🥈≥${thr[1]} · 🥇≥${thr[2]} · 💎${thr[3]}</div>
      <div class="sublabel">escolha o lendário/raro</div>
      <div class="opts">${rec.map(optCard).join('')}</div>
      ${rest.length?`<button class="more" onclick="this.nextElementSibling.classList.toggle('open');this.classList.toggle('open')">▸ ver todas (${rest.length})</button><div class="opts more-opts">${rest.map((o,i)=>optCard(o,i+2)).join('')}</div>`:''}
      <div class="sublabel">progressão de tiers</div><div class="prog-strip" id="prog-${sg}">${renderProg(r)}</div>
    </div>`;
  }).join('');
  REGIONS.forEach(r=>{ if(sel[slug(r.nm)]===undefined) sel[slug(r.nm)]=0; });
  refresh();
}
function pick(sg,i){ sel[sg]=i; const r=REGIONS.find(x=>slug(x.nm)===sg); document.getElementById('prog-'+sg).innerHTML=renderProg(r); refresh(); }
function refresh(){
  const chosen={}; let n=0;
  REGIONS.forEach(r=>{ const sg=slug(r.nm), o=r.opts[sel[sg]], tag=document.getElementById('tag-'+sg); if(o){ n++; chosen[o.n]=sg; if(tag) tag.textContent='✓ '+o.nm; } });
  document.querySelectorAll('.optT').forEach(el=>{ const on=sel[el.dataset.sg]==+el.dataset.i; el.classList.toggle('sel',on); const owner=chosen[el.dataset.key]; el.classList.toggle('dup', !!owner && owner!==el.dataset.sg && !on); });
  document.getElementById('fill').style.width=(n/10*100)+'%'; document.getElementById('prog').textContent=n+'/10';
}
function copyChoices(){ let L=['ESCOLHAS DE LENDÁRIO POR REGIÃO:']; REGIONS.forEach(r=>{const o=r.opts[sel[slug(r.nm)]];L.push('- '+r.nm+' → '+(o?o.nm:'-'));});
  const txt=L.join('\\n'),ta=document.getElementById('out');ta.value=txt;ta.classList.add('show');ta.select();if(navigator.clipboard)navigator.clipboard.writeText(txt).catch(()=>{}); }
render();
</script></body></html>
