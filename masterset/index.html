<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Master Sets — Rastreador</title>
<style>
@property --pct{syntax:'<number>';inherits:false;initial-value:0}
:root{
  --bg:#0f1424; --bg2:#151d33; --surface:#1a2440; --surface2:#1c2749; --board:#0b0f1c;
  --line:#2b3a5e; --line2:#3a4d75; --hair:rgba(255,255,255,.06);
  --text:#eaf0fb; --dim:#93a4c4; --ink60:rgba(255,255,255,.6);
  --accent:#ff4d6d; --accent2:#ff85a1; --gold:#ffce45; --green:#28d08a; --track:rgba(255,255,255,.10);
  --radius:16px; --shadow:0 12px 34px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--text);min-height:100vh;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(1100px 460px at 50% -220px, rgba(255,77,109,.10), transparent 70%), linear-gradient(180deg,#0f1424,#0b0f1c);}
button{font-family:inherit}
.tnum{font-variant-numeric:tabular-nums;letter-spacing:-.01em}

.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:11px 18px;background:rgba(15,20,36,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.06rem}
.brand .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--gold));display:flex;align-items:center;justify-content:center;font-size:1rem;box-shadow:var(--shadow)}
.brand b{color:var(--gold)}
.sp{flex:1}
.acct{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 6px 4px 12px}
.acct .nm{font-size:.82rem;font-weight:600;color:var(--dim);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct .avatar{width:30px;height:30px;border-radius:50%;border:1px solid var(--line2);object-fit:cover}
.acct .out{border:none;background:var(--surface2);color:var(--dim);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:.95rem}
.acct .out:hover{background:var(--accent);color:#fff}
@media(max-width:560px){.acct .nm{display:none}}
.btn{border:1px solid var(--line2);background:var(--surface);color:var(--text);border-radius:11px;padding:9px 15px;font-size:.86rem;font-weight:700;cursor:pointer;transition:all .12s}
.btn:hover{border-color:var(--dim)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(255,77,109,.32)}
.wrap{max-width:1320px;margin:0 auto;padding:20px 18px 90px}
.hidden{display:none!important}
.backbtn{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);color:var(--dim);font-size:.84rem;font-weight:700;cursor:pointer;padding:8px 14px 8px 11px;border-radius:99px;margin-bottom:16px;transition:all .12s}
.backbtn:hover{border-color:var(--line2);color:var(--text);transform:translateX(-2px)}

.login{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding:20px}
.login .big{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,var(--accent),var(--gold));display:flex;align-items:center;justify-content:center;font-size:2.2rem;box-shadow:var(--shadow)}
.login h1{font-size:2rem;margin:0}.login p{color:var(--dim);max-width:440px;line-height:1.5;margin:0}

/* ---- value hero (dashboard) ---- */
.vhero{position:relative;border-radius:22px;padding:22px 22px;margin-bottom:18px;overflow:hidden;
  background:radial-gradient(120% 140% at 82% 0%,rgba(255,206,69,.09),transparent 55%),linear-gradient(180deg,var(--surface2),var(--surface));
  border:1px solid var(--hair);box-shadow:var(--shadow)}
.vhero .lbl{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-weight:700}
.vhero .val{font-size:clamp(2.2rem,7vw,3rem);font-weight:800;line-height:1;margin-top:4px}
.vhero .val small{font-size:.9rem;color:var(--dim);font-weight:600;margin-left:6px}
.vhero .stats{display:flex;gap:22px;margin-top:16px;flex-wrap:wrap}
.vhero .stat b{font-size:1.35rem;font-weight:800;display:block}
.vhero .stat span{font-size:.72rem;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}

.sec-title{display:flex;align-items:center;gap:12px;margin:2px 2px 16px}
.sec-title h2{font-size:1.35rem;font-weight:800;margin:0}.sec-title .sub{color:var(--dim);font-size:.82rem;font-weight:600}

.symtile{width:36px;height:36px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.symtile img{width:26px;height:26px;object-fit:contain}.symtile .ph{font-weight:800;color:var(--dim)}

/* ---- dashboard set cards (art bg) ---- */
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.setcard{position:relative;isolation:isolate;border-radius:18px;overflow:hidden;min-height:150px;cursor:pointer;background:var(--surface);border:1px solid var(--line);transition:transform .12s,border-color .12s}
.setcard:hover{transform:translateY(-3px);border-color:var(--line2)}
.setcard[data-complete="true"]{border-color:rgba(255,206,69,.5)}
.setcard .art{position:absolute;inset:-30%;z-index:0;opacity:.22;filter:blur(15px) saturate(1.35);transform:rotate(-8deg) scale(1.4);background:center/contain no-repeat}
.setcard .scrim{position:absolute;inset:0;z-index:1;background:linear-gradient(150deg,rgba(15,20,36,.28),rgba(15,20,36,.72) 55%,rgba(15,20,36,.95))}
.setcard .logo{position:absolute;top:14px;left:15px;z-index:2;height:30px;max-width:58%;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,.55))}
.setcard .star{position:absolute;top:12px;right:13px;z-index:3;font-size:1.15rem;cursor:pointer;color:var(--gold);background:none;border:none;line-height:1}
.setcard .sc-c{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:15px 16px 17px;display:grid;gap:3px}
.sc-name{font-weight:800;font-size:1.05rem;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.sc-meta{font-size:.74rem;color:var(--ink60)}
.sc-value{font-weight:700;color:var(--gold);font-size:.9rem}
.setcard .edge{position:absolute;left:0;right:0;bottom:0;z-index:3;height:5px;background:var(--track)}
.setcard .edge i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--gold));transition:width .6s cubic-bezier(.2,.7,.2,1)}
.setcard[data-complete="true"] .edge i{background:var(--gold)}
.nodata-tag{font-size:.66rem;color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:2px 9px;display:inline-block}
.empty{color:var(--dim);text-align:center;padding:48px 16px;line-height:1.6;background:var(--surface);border:1px dashed var(--line2);border-radius:16px}

/* ---- browser ---- */
.search{width:100%;padding:12px 15px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);font-size:.92rem;margin-bottom:10px}
.search:focus{outline:none;border-color:var(--accent)}
.filterbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.selwrap{position:relative}
.filterbar select{appearance:none;padding:8px 30px 8px 13px;border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--text);font-size:.82rem;font-weight:600;cursor:pointer}
.selwrap::after{content:'▾';position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--dim);pointer-events:none;font-size:.7rem}
.chip{padding:8px 14px;border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--dim);font-size:.82rem;font-weight:700;cursor:pointer;user-select:none;transition:all .12s}
.chip:hover{border-color:var(--line2)}.chip.on{background:rgba(255,77,109,.16);border-color:var(--accent);color:var(--accent2)}
.brow-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.brow-item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:11px 13px}
.brow-item .bi-b{flex:1;min-width:0}
.bi-name{font-weight:700;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bi-meta{color:var(--dim);font-size:.73rem;margin-top:1px}
.addbtn{border:1px solid var(--line2);background:var(--surface2);color:var(--text);border-radius:10px;width:38px;height:38px;font-size:1.15rem;cursor:pointer;flex:none}
.addbtn.on{background:var(--gold);color:#3a2e00;border-color:var(--gold)}
.brow-item.nodata{opacity:.6}

/* ---- tracker header ---- */
.sethead{position:relative;isolation:isolate;overflow:hidden;border-radius:20px;border:1px solid var(--line2);padding:18px;margin-bottom:14px;display:flex;align-items:center;gap:18px}
.sethead .art{position:absolute;inset:-30%;z-index:0;opacity:.20;filter:blur(18px) saturate(1.3);transform:scale(1.4);background:center/contain no-repeat}
.sethead .scrim{position:absolute;inset:0;z-index:1;background:linear-gradient(120deg,rgba(15,20,36,.55),rgba(15,20,36,.82))}
.sethead .sh-main{position:relative;z-index:2;flex:1;min-width:0}
.sethead .logo{height:52px;max-width:70%;object-fit:contain;filter:drop-shadow(0 2px 8px rgba(0,0,0,.6));margin-bottom:8px}
.sethead h1{margin:0;font-size:1.3rem;font-weight:800}
.sethead .sh-meta{color:var(--dim);font-size:.8rem;margin-top:2px}
.sethead .bars{margin-top:11px;display:grid;gap:5px;max-width:360px}
.sethead .brow{display:flex;align-items:center;gap:8px;font-size:.68rem;color:var(--dim);font-weight:700}
.sethead .brow .t{width:64px}.sethead .brow .bk{flex:1;height:7px;background:var(--track);border-radius:6px;overflow:hidden}
.sethead .brow .bk i{display:block;height:100%;width:0;transition:width .5s}
.sethead .brow.cpl .bk i{background:var(--gold)} .sethead .brow.mst .bk i{background:var(--green)}
.sethead .star{position:relative;z-index:2;font-size:1.5rem;cursor:pointer;color:var(--gold);background:none;border:none;align-self:flex-start}
.ring{position:relative;z-index:2;--pct:0;width:96px;height:96px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(from -90deg,var(--green),var(--gold) calc(var(--pct)*1%),var(--track) 0);transition:--pct .8s cubic-bezier(.2,.7,.2,1)}
.ring::before{content:"";position:absolute;width:74px;height:74px;border-radius:50%;background:#141b30}
.ring b{position:relative;font-size:1.25rem;font-weight:800}
.ring.done{background:conic-gradient(var(--gold) 0 100%)}
.ring.cel{animation:aura 1.1s ease-out 1}
@keyframes aura{0%{box-shadow:0 0 0 0 rgba(255,206,69,.55)}100%{box-shadow:0 0 0 26px rgba(255,206,69,0)}}
@media(max-width:560px){.sethead .ring{width:74px;height:74px}.sethead .ring::before{width:56px;height:56px}.sethead .logo{height:40px}}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select{padding:10px 13px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--text);font-size:.85rem}
.toolbar input{flex:1;min-width:150px}.toolbar input:focus,.toolbar select:focus{outline:none;border-color:var(--accent)}
.vtoggle{display:inline-flex;padding:4px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--hair)}
.vtoggle button{padding:8px 13px;border:0;background:transparent;color:var(--dim);font-weight:700;font-size:.82rem;border-radius:9px;cursor:pointer}
.vtoggle button[aria-pressed="true"]{color:#fff;background:color-mix(in srgb,var(--accent) 24%,transparent)}
.count-line{color:var(--dim);font-size:.78rem;margin:0 2px 12px}

/* ---- grid ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:15px}
.c{background:var(--surface);border:1px solid var(--line);border-radius:15px;overflow:hidden;display:flex;flex-direction:column}
.c.done{border-color:var(--gold);box-shadow:0 0 0 1px rgba(255,206,69,.35)}
.c-img{position:relative;aspect-ratio:.72;background:#0c1120 center/contain no-repeat;display:flex;align-items:center;justify-content:center}
.c-img img{width:100%;height:100%;object-fit:contain}.c-img .na{color:var(--dim);font-size:.72rem}
.c.none .c-img img{filter:grayscale(.9) brightness(.62)}
.pg{position:absolute;top:7px;left:7px;background:rgba(0,0,0,.66);color:#fff;font-size:.67rem;font-weight:800;padding:2px 8px;border-radius:99px}
.cprog{position:absolute;top:7px;right:7px;background:rgba(0,0,0,.66);color:#fff;font-size:.67rem;font-weight:800;padding:2px 8px;border-radius:99px}
.c.done .cprog{background:var(--gold);color:#3a2e00}
.donebadge{display:none;position:absolute;bottom:7px;left:7px;background:var(--gold);color:#3a2e00;font-size:.66rem;font-weight:800;padding:3px 10px;border-radius:99px}
.c.done .donebadge{display:block}
.c-b{padding:11px 12px 13px;display:flex;flex-direction:column;gap:7px}
.c-name{font-weight:700;font-size:.9rem;line-height:1.18}.c-meta{color:var(--dim);font-size:.72rem}.c-meta .mv{color:var(--gold);font-weight:700}
.vlist{display:flex;flex-wrap:wrap;gap:7px;margin-top:5px}
.v{font-size:.74rem;font-weight:700;padding:8px 12px;border-radius:11px;cursor:pointer;border:1.5px solid var(--line2);background:var(--surface2);color:var(--dim);user-select:none;transition:all .1s;min-height:36px;display:inline-flex;align-items:center;gap:5px}
.v:hover{border-color:var(--dim)}.v:active{transform:scale(.93)}
.v .dot{width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor;flex:none}
.v.on{color:#0c1a10;border-color:transparent;font-weight:800}.v.on .dot{background:rgba(0,0,0,.5);border-color:transparent}
.v.on.v-normal{background:#c3d0e6}.v.on.v-holo{background:var(--gold)}.v.on.v-rev{background:#7fd0ff}.v.on.v-ball{background:#ff9ec4}

/* ---- table ---- */
.tbl{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.trow{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--surface)}
.trow:nth-child(even){background:#182137}
.trow.done{background:rgba(255,206,69,.08)}
.trow .tn{width:52px;color:var(--dim);font-size:.76rem;font-weight:700;flex:none}
.trow .tnm{flex:1;min-width:0;font-size:.85rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .tnm small{color:var(--dim);font-weight:500}
.trow .tv{flex:none;color:var(--gold);font-size:.76rem;font-weight:700;width:60px;text-align:right}
.trow .vlist{margin:0;justify-content:flex-end;flex:none;max-width:60%}
.trow .v{padding:6px 9px;min-height:30px;font-size:.68rem}
@media(max-width:640px){.trow{flex-wrap:wrap}.trow .vlist{max-width:100%;width:100%;justify-content:flex-start;margin-top:4px}}

/* ---- binder ---- */
.binder{max-width:640px;margin:0 auto;padding:16px;border-radius:16px;background:linear-gradient(180deg,#141b30,var(--board));box-shadow:inset 0 1px 0 rgba(255,255,255,.04),var(--shadow)}
.bpage{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pocket{display:flex;flex-direction:column;gap:6px;background:rgba(255,255,255,.03);border-radius:10px;padding:8px;box-shadow:inset 0 2px 6px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.04)}
.pocket .pk-img{position:relative;aspect-ratio:.72;border-radius:7px;overflow:hidden;background:#0c1120 center/contain no-repeat;display:flex;align-items:center;justify-content:center}
.pocket .pk-img img{width:100%;height:100%;object-fit:contain}
.pocket.none .pk-img img{filter:grayscale(1) brightness(.5)}
.pocket .pk-n{position:absolute;top:4px;left:4px;background:rgba(0,0,0,.66);color:#fff;font-size:.6rem;font-weight:800;padding:1px 6px;border-radius:99px}
.pocket .vlist{gap:4px}.pocket .v{padding:5px 7px;min-height:26px;font-size:.62rem;border-radius:8px}
.bpager{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:14px}
.bpager button{background:var(--surface2);border:1px solid var(--line2);color:var(--text);width:40px;height:40px;border-radius:10px;font-size:1.1rem;cursor:pointer}
.bpager button:disabled{opacity:.4;cursor:default}
.bpager .pp{font-size:.82rem;color:var(--dim);font-weight:700}
@media(max-width:520px){.pocket .vlist{display:none}}

.loading{text-align:center;color:var(--dim);padding:60px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(10px);background:var(--surface2);border:1px solid var(--line2);color:#fff;padding:10px 18px;border-radius:99px;font-size:.84rem;font-weight:600;z-index:60;opacity:0;transition:all .25s;pointer-events:none;box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.confetti{position:fixed;width:9px;height:12px;border-radius:2px;z-index:100;animation:fall var(--d) cubic-bezier(.15,.6,.4,1) forwards;pointer-events:none}
@keyframes fall{to{transform:translate(var(--x),62vh) rotate(var(--r));opacity:0}}
@media(max-width:600px){.wrap{padding:16px 13px 90px}.dash-grid,.brow-list{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr;gap:11px}.v{font-size:.76rem;padding:9px 11px;min-height:40px}.sethead h1{font-size:1.12rem}}
@media(max-width:380px){.grid{grid-template-columns:1fr}}
#bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;transition:background .6s ease}
.cmodal{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(6,9,18,.72);backdrop-filter:blur(6px)}
.cmodal.on{display:flex}
.cm-box{width:100%;max-width:740px;max-height:92vh;overflow:auto;display:flex;background:var(--surface);border:1px solid var(--line2);border-radius:18px;box-shadow:var(--shadow)}
.cm-img{flex:0 0 42%;background:#0c1120;display:flex;align-items:center;justify-content:center;padding:18px}
.cm-img img{width:100%;border-radius:10px}
.cm-info{flex:1;min-width:0;padding:20px;position:relative}
.cm-x{position:absolute;top:14px;right:14px;background:var(--surface2);border:1px solid var(--line2);color:var(--dim);width:32px;height:32px;border-radius:50%;cursor:pointer}
.cm-info h3{margin:0 36px 2px 0;font-size:1.3rem;font-weight:800}
.cm-meta{color:var(--dim);font-size:.82rem}
.cm-tags{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.cm-tags span{background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:4px 11px;font-size:.75rem;font-weight:600}
.cm-vt{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);font-weight:700;margin-top:8px}
.cm-vlist{display:flex;flex-direction:column;gap:7px;margin-top:8px}
.cmv{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1.5px solid var(--line2);background:var(--surface2);color:var(--text);border-radius:11px;padding:11px 13px;cursor:pointer;font-weight:600}
.cmv .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--dim);flex:none}
.cmv .cmv-l{flex:1}.cmv .cmv-p{color:var(--gold);font-weight:700;font-size:.82rem}
.cmv.on{border-color:transparent;color:#0c1a10}.cmv.on .dot{background:rgba(0,0,0,.5);border-color:transparent}.cmv.on .cmv-p{color:#0c1a10}
.cmv.on.v-normal{background:#c3d0e6}.cmv.on.v-holo{background:var(--gold)}.cmv.on.v-rev{background:#7fd0ff}.cmv.on.v-ball{background:#ff9ec4}
.cm-val{margin-top:14px;color:var(--dim);font-size:.85rem}.cm-val b{color:var(--gold);font-size:1.05rem}
.c-img,.c-name,.pk-img,.trow .tnm{cursor:pointer}
@media(max-width:600px){.cm-box{flex-direction:column;max-height:94vh}.cm-img{flex:none;max-height:44vh}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="bgfx"></div>
<div class="topbar"><div class="brand"><span class="logo">🗂️</span> Master<b>Sets</b></div><div class="sp"></div><div id="userbox"></div></div>
<div class="wrap"><div id="app"><div class="loading">Carregando…</div></div></div>
<div class="toast" id="toast"></div>
<div class="cmodal" id="cardmodal"><div class="cm-box"></div></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = { apiKey:'AIzaSyCofvOU_VGgvYuNMVMdGXFnrZPuBsUBd7k', authDomain:'pokedex-82ba8.firebaseapp.com', projectId:'pokedex-82ba8', storageBucket:'pokedex-82ba8.firebasestorage.app', messagingSenderId:'783841506180', appId:'1:783841506180:web:36a300cf04811ba93be3d1' };
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(); const db=firebase.firestore();
try{ db.enablePersistence({synchronizeTabs:true}); }catch(e){}
const googleProvider=new firebase.auth.GoogleAuthProvider();

const VAR={
  normal:{lbl:'Normal',short:'Normal',cls:'v-normal',grp:'normal'},
  holofoil:{lbl:'Holo',short:'Holo',cls:'v-holo',grp:'holofoil'},
  reverseHolofoil:{lbl:'Reverse Holo',short:'Reverse',cls:'v-rev',grp:'reverseHolofoil'},
  energyPattern:{lbl:'Reverse · Energia',short:'Energia',cls:'v-rev',grp:'energyPattern'},
  pokeballPattern:{lbl:'Poké Ball',short:'Poké Ball',cls:'v-ball',grp:'ball'},
  duskballPattern:{lbl:'Dusk Ball',short:'Dusk',cls:'v-ball',grp:'ball'},
  loveBallPattern:{lbl:'Love Ball',short:'Love',cls:'v-ball',grp:'ball'},
  friendballPattern:{lbl:'Friend Ball',short:'Friend',cls:'v-ball',grp:'ball'},
  quickballPattern:{lbl:'Quick Ball',short:'Quick',cls:'v-ball',grp:'ball'},
  rocketPattern:{lbl:'Rocket',short:'Rocket',cls:'v-ball',grp:'ball'}
};
const BALL=Object.keys(VAR).filter(k=>VAR[k].grp==='ball');
const VF_ORDER=[['normal','Normal'],['holofoil','Holo'],['reverseHolofoil','Reverse Holo'],['energyPattern','Reverse · Energia']];
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

let user=null, SETS=[], byId={}, favorites=new Set(), owned={}, values={}, view={name:'dash'}, setDataCache={};
const app=document.getElementById('app'), toastEl=document.getElementById('toast');
function toast(m){ toastEl.textContent=m; toastEl.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>toastEl.classList.remove('on'),1900); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function nameOf(s){ return s?(s.namePt||s.name):''; }
function money(n){ n=n||0; return n>=1000?'$'+(n/1000).toFixed(2)+'k':'$'+n.toFixed(2); }
function fdate(iso){ const m=String(iso||'').match(/^(\d{4})-(\d{2})/); return m?MES[+m[2]-1]+'/'+m[1]:''; }
function hexA(h,a){ h=h||'#4d6bff'; if(h[0]!=='#'||h.length<7)return 'rgba(77,107,255,'+a+')'; const n=parseInt(h.slice(1,7),16); return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')'; }
function setBg(css){ const b=document.getElementById('bgfx'); if(b)b.style.background=css; }
const BG_DASH='radial-gradient(900px 560px at 12% -8%, rgba(55,130,224,.18), transparent 60%),radial-gradient(760px 620px at 100% 12%, rgba(150,90,255,.12), transparent 55%),linear-gradient(180deg,#0b1020,#070b16 78%)';
const BG_BROWSE='radial-gradient(1100px 520px at 50% -14%, rgba(140,160,205,.09), transparent 55%),linear-gradient(180deg,#0b1020,#070b16)';
function bgSet(col){ col=col||'#4d6bff'; return 'radial-gradient(820px 560px at 85% -10%,'+hexA(col,.26)+', transparent 60%),radial-gradient(680px 620px at -8% 8%,'+hexA(col,.15)+', transparent 55%),radial-gradient(620px 600px at 45% 122%, rgba(41,90,160,.15), transparent 55%),linear-gradient(180deg,#0b1020,#070b16 78%)'; }
function symMini(s){ return '<div class="symtile">'+(s&&s.sym64?'<img src="'+s.sym64+'">':'<span class="ph">'+esc((nameOf(s)||'?')[0])+'</span>')+'</div>'; }
const lsKey=()=>'ms_'+(user?user.uid:'anon');
function cacheLocal(){ try{ localStorage.setItem(lsKey(),JSON.stringify({fav:[...favorites],owned:Object.fromEntries(Object.entries(owned).map(([k,v])=>[k,[...v]])),values})); }catch(e){} }
function loadLocal(){ try{ const d=JSON.parse(localStorage.getItem(lsKey())); if(d){ favorites=new Set(d.fav||[]); owned={}; for(const k in(d.owned||{}))owned[k]=new Set(d.owned[k]); values=d.values||{}; } }catch(e){} }

auth.onAuthStateChanged(async(u)=>{
  user=u; renderUserbox();
  if(!u){ renderLogin(); return; }
  loadLocal(); render();
  const r=db.collection('users').doc(u.uid);
  try{ await r.set({updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true}); }catch(e){}
  r.onSnapshot(snap=>{
    const d=snap.data()||{};
    favorites=new Set(d.masterFavorites||[]);
    owned={}; const ms=d.masterSets||{}; for(const sid in ms)owned[sid]=new Set(ms[sid]||[]);
    values=d.masterValues||{};
    cacheLocal(); render();
  },err=>console.error('snapshot',err));
});
function renderUserbox(){
  const b=document.getElementById('userbox');
  if(user){ b.innerHTML='<div class="acct"><span class="nm">'+esc((user.displayName||user.email||'').split(' ')[0])+'</span><img class="avatar" src="'+esc(user.photoURL||'')+'" referrerpolicy="no-referrer" alt="" onerror="this.style.display=\'none\'"><button class="out" id="logout" title="Sair">⎋</button></div>';
    document.getElementById('logout').onclick=()=>auth.signOut(); } else b.innerHTML='';
}
function renderLogin(){ app.innerHTML='<div class="login"><div class="big">🗂️</div><h1>Master Sets</h1><p>Controle suas coleções e variações, veja o valor estimado e sincronize entre PC e celular.</p><button class="btn primary" id="login">Entrar com Google</button></div>';
  document.getElementById('login').onclick=async()=>{ try{ await auth.signInWithPopup(googleProvider); }catch(e){ toast('Falha no login'); } }; }

function ref(){ return db.collection('users').doc(user.uid); }
async function toggleFavorite(sid){
  const on=favorites.has(sid); if(on)favorites.delete(sid); else favorites.add(sid); cacheLocal();
  try{ await ref().update({masterFavorites:on?firebase.firestore.FieldValue.arrayRemove(sid):firebase.firestore.FieldValue.arrayUnion(sid)}); }
  catch(e){ try{ await ref().set({masterFavorites:[...favorites]},{merge:true}); }catch(_){}}
}
async function toggleSlot(sid,slot){
  if(!owned[sid])owned[sid]=new Set();
  const on=owned[sid].has(slot); if(on)owned[sid].delete(slot); else owned[sid].add(slot); cacheLocal();
  const fp='masterSets.'+sid;
  try{ await ref().update({[fp]:on?firebase.firestore.FieldValue.arrayRemove(slot):firebase.firestore.FieldValue.arrayUnion(slot)}); }
  catch(e){ try{ await ref().set({masterSets:{[sid]:[...owned[sid]]}},{merge:true}); }catch(_){}}
}
let valTimer;
function syncValue(sid,v){ values[sid]=Math.round(v*100)/100; clearTimeout(valTimer); valTimer=setTimeout(()=>{ try{ ref().set({masterValues:{[sid]:values[sid]}},{merge:true}); }catch(e){} },700); }

async function loadSetsIndex(){ if(SETS.length)return; try{ let a=await(await fetch('sets_index.json?v=6')).json(); const seen={}; SETS=a.filter(s=>seen[s.id]?false:(seen[s.id]=1)); byId={}; SETS.forEach(s=>byId[s.id]=s); }catch(e){ SETS=[]; } }
async function loadSetData(sid){ if(setDataCache[sid])return setDataCache[sid]; const d=await(await fetch('data/'+sid+'.json?v=2')).json(); setDataCache[sid]=d; return d; }

async function render(){ await loadSetsIndex(); if(!user){ renderLogin(); return; } if(view.name==='dash')renderDash(); else if(view.name==='browse')renderBrowse(); else if(view.name==='set')renderSet(view.sid); }
function go(v){ view=v; render(); window.scrollTo(0,0); }

// ---------- dashboard ----------
function renderDash(){
  setBg(BG_DASH);
  const favs=SETS.filter(s=>favorites.has(s.id));
  let grand=0,vars=0,done=0;
  favs.forEach(s=>{ grand+=(values[s.id]||0); const t=s.totalSlots||0,o=(owned[s.id]||new Set()).size; vars+=o; if(t&&o>=t)done++; });
  let html='<div class="vhero"><div class="lbl">Valor estimado da coleção</div><div class="val tnum">'+money(grand)+'<small>USD · mercado</small></div>'
    +'<div class="stats"><div class="stat"><b class="tnum">'+vars+'</b><span>variações</span></div><div class="stat"><b class="tnum">'+favs.length+'</b><span>coleções</span></div><div class="stat"><b class="tnum">'+done+'</b><span>completas</span></div></div></div>';
  html+='<div class="sec-title"><div><h2>Minhas coleções</h2></div><div class="sp"></div><button class="btn primary" id="add">+ Adicionar</button></div>';
  if(!favs.length){ html+='<div class="empty">Você ainda não adicionou coleções.<br>Toque em <b>+ Adicionar</b> para escolher os master sets que quer controlar.</div>'; }
  else{
    html+='<div class="dash-grid">'+favs.map(s=>{
      const o=(owned[s.id]||new Set()).size,t=s.totalSlots||0,pct=t?Math.round(o/t*100):0,cmp=t&&o>=t;
      const meta=[s.seriesName,fdate(s.releaseDate),s.total+' cartas'].filter(Boolean).join(' · ');
      return '<div class="setcard" data-sid="'+s.id+'" data-complete="'+cmp+'">'
        +'<div class="art" style="background-image:url('+(s.sym64||'')+')"></div><div class="scrim"></div>'
        +(s.logo64?'<img class="logo" src="'+s.logo64+'">':'')
        +'<button class="star" data-fav="'+s.id+'" title="Remover">★</button>'
        +'<div class="sc-c"><div class="sc-name">'+esc(nameOf(s))+'</div><div class="sc-meta tnum">'+esc(meta)+'</div>'
        +(s.hasData?('<div class="sc-value tnum">'+money(values[s.id]||0)+' · '+pct+'%</div>'):'<span class="nodata-tag">sem dados</span>')+'</div>'
        +(s.hasData?'<div class="edge"><i style="width:'+pct+'%"></i></div>':'')+'</div>';
    }).join('')+'</div>';
  }
  app.innerHTML=html;
  document.getElementById('add').onclick=()=>go({name:'browse'});
  app.querySelectorAll('.setcard').forEach(el=>el.onclick=e=>{ if(e.target.closest('.star'))return; const s=byId[el.dataset.sid]; if(!s.hasData){toast('Dados desta coleção ainda não gerados');return;} go({name:'set',sid:el.dataset.sid}); });
  app.querySelectorAll('.star').forEach(el=>el.onclick=e=>{ e.stopPropagation(); toggleFavorite(el.dataset.fav); });
}

// ---------- browser ----------
function renderBrowse(){
  setBg(BG_BROWSE);
  const seriesList=[...new Set(SETS.map(s=>s.seriesName).filter(Boolean))];
  app.innerHTML='<button class="backbtn" id="back">← Minhas coleções</button>'
    +'<div class="sec-title"><div><h2>Adicionar coleção</h2><div class="sub">'+SETS.length+' coleções disponíveis</div></div></div>'
    +'<input class="search" id="q" placeholder="Buscar coleção…">'
    +'<div class="filterbar"><div class="selwrap"><select id="fserie"><option value="">Todas as séries</option>'+seriesList.map(x=>'<option>'+esc(x)+'</option>').join('')+'</select></div>'
    +'<div class="selwrap"><select id="flang"><option value="">EN + JP</option><option value="EN">Só inglês</option><option value="JP">Só japonês</option></select></div>'
    +'<span class="chip" id="fdata">Com dados</span><span class="chip" id="ffav">★ Favoritos</span></div><div class="brow-list" id="blist"></div>';
  document.getElementById('back').onclick=()=>go({name:'dash'});
  const F={q:'',serie:'',lang:'',data:false,fav:false},listEl=document.getElementById('blist');
  function paint(){
    let list=SETS.filter(s=>{
      if(F.q){const h=(nameOf(s)+' '+s.name+' '+(s.seriesName||'')).toLowerCase(); if(!h.includes(F.q))return false;}
      if(F.serie&&s.seriesName!==F.serie)return false;
      if(F.lang&&s.category!==F.lang)return false;
      if(F.data&&!s.hasData)return false;
      if(F.fav&&!favorites.has(s.id))return false; return true;
    });
    list.sort((a,b)=>(b.hasData?1:0)-(a.hasData?1:0)||String(b.releaseDate).localeCompare(String(a.releaseDate)));
    const shown=list.slice(0,300);
    listEl.innerHTML=shown.length?shown.map(s=>{const on=favorites.has(s.id);
      return '<div class="brow-item'+(s.hasData?'':' nodata')+'">'+symMini(s)+'<div class="bi-b"><div class="bi-name">'+esc(nameOf(s))+'</div><div class="bi-meta">'+esc(s.seriesName||'')+' · '+(fdate(s.releaseDate)||'')+' · '+s.total+' cartas'+(s.hasData?'':' · <span class="nodata-tag">sem dados</span>')+'</div></div><button class="addbtn'+(on?' on':'')+'" data-fav="'+s.id+'">'+(on?'★':'+')+'</button></div>';
    }).join(''):'<div class="empty">Nenhuma coleção com esses filtros.</div>';
    listEl.querySelectorAll('.addbtn').forEach(el=>el.onclick=()=>{ toggleFavorite(el.dataset.fav); el.classList.toggle('on'); el.textContent=el.classList.contains('on')?'★':'+'; });
  }
  document.getElementById('q').addEventListener('input',e=>{F.q=e.target.value.toLowerCase().trim();paint();});
  document.getElementById('fserie').addEventListener('change',e=>{F.serie=e.target.value;paint();});
  document.getElementById('flang').addEventListener('change',e=>{F.lang=e.target.value;paint();});
  document.getElementById('fdata').onclick=e=>{F.data=!F.data;e.target.classList.toggle('on',F.data);paint();};
  document.getElementById('ffav').onclick=e=>{F.fav=!F.fav;e.target.classList.toggle('on',F.fav);paint();};
  paint();
}

// ---------- tracker ----------
let cardView=localStorage.getItem('ms_view')||'grid';
let celebrated={};
function confetti(){ if(matchMedia('(prefers-reduced-motion:reduce)').matches)return; const cs=['#ffce45','#28d08a','#ff4d6d','#fff']; for(let i=0;i<40;i++){ const p=document.createElement('i'); p.className='confetti'; p.style.cssText='--x:'+((Math.random()*2-1)*60)+'vw;--r:'+(Math.random()*720-360)+'deg;--d:'+(750+Math.random()*450)+'ms;background:'+cs[i%4]+';left:50%;top:36%;animation-delay:'+(Math.random()*140)+'ms'; document.body.appendChild(p); p.addEventListener('animationend',()=>p.remove()); } }

async function renderSet(sid){
  const meta=byId[sid]||{};
  setBg(bgSet(meta.color));
  app.innerHTML='<button class="backbtn" id="back">← Minhas coleções</button><div class="loading">Carregando '+esc(nameOf(meta)||'coleção')+'…</div>';
  document.getElementById('back').onclick=()=>go({name:'dash'});
  let data; try{ data=await loadSetData(sid); }catch(e){ app.innerHTML='<button class="backbtn" id="b2">← Minhas coleções</button><div class="empty">Não foi possível carregar os dados desta coleção.</div>'; document.getElementById('b2').onclick=()=>go({name:'dash'}); return; }
  const oset=()=>owned[sid]||new Set();
  const sk=(id,v)=>id+'|'+v;
  const F={q:'',rar:'',vf:'',st:''};
  const cardDone=r=>r.variants.every(v=>oset().has(sk(r.id,v)));
  const cardN=r=>r.variants.filter(v=>oset().has(sk(r.id,v))).length;
  const cardHasAny=r=>r.variants.some(v=>oset().has(sk(r.id,v)));
  const cardFullValue=r=>r.variants.reduce((a,v)=>a+((r.p&&r.p[v])||0),0);
  function ownedValue(){ let v=0; data.rows.forEach(r=>r.variants.forEach(x=>{ if(oset().has(sk(r.id,x)))v+=(r.p&&r.p[x])||0; })); return v; }
  let binderPage=0;

  const present=new Set(); data.rows.forEach(r=>r.variants.forEach(v=>present.add(v)));
  const hasBall=BALL.some(v=>present.has(v));
  const vfOpts=VF_ORDER.filter(([k])=>present.has(k)).map(([k,l])=>'<option value="'+k+'">'+l+'</option>').join('')+(hasBall?'<option value="__ball">Poké Ball (todas)</option>':'');
  const rars=[...new Set(data.rows.map(r=>r.rarity))].filter(Boolean).sort();

  app.innerHTML='<button class="backbtn" id="back">← Minhas coleções</button>'
    +'<div class="sethead"><div class="art" style="background-image:url('+(meta.sym64||'')+')"></div><div class="scrim"></div>'
    +'<div class="sh-main">'+(meta.logo64?'<img class="logo" src="'+meta.logo64+'">':'<h1>'+esc(nameOf(meta)||data.setName)+'</h1>')
    +'<div class="sh-meta tnum">'+esc(meta.seriesName||'')+' · '+(fdate(meta.releaseDate)||'')+' · '+(meta.total||data.rows.length)+' cartas · valor <b id="ov" style="color:var(--gold)">$0</b> / '+money(data.fullValue||0)+'</div>'
    +'<div class="bars"><div class="brow cpl"><span class="t">Completo</span><span class="bk"><i id="bcpl"></i></span><span id="pcpl">0%</span></div>'
    +'<div class="brow mst"><span class="t">Master</span><span class="bk"><i id="bmst"></i></span><span id="pmst">0%</span></div></div></div>'
    +'<div class="ring" id="ring"><b id="pct">0%</b></div>'
    +'<button class="star" data-fav="'+sid+'">'+(favorites.has(sid)?'★':'☆')+'</button></div>'
    +'<div class="toolbar"><input type="search" id="q" placeholder="Buscar carta…">'
    +'<div class="selwrap"><select id="rar"><option value="">Todas raridades</option>'+rars.map(r=>'<option>'+esc(r)+'</option>').join('')+'</select></div>'
    +'<div class="selwrap"><select id="vf"><option value="">Todas variações</option>'+vfOpts+'</select></div>'
    +'<div class="selwrap"><select id="st"><option value="">Todas</option><option value="miss">Incompletas</option><option value="done">Completas</option></select></div>'
    +'<div class="vtoggle" id="vt"><button data-view="grid">Grid</button><button data-view="table">Tabela</button><button data-view="binder">Binder</button></div></div>'
    +'<div class="count-line" id="cl"></div><div id="area"></div>';
  document.getElementById('back').onclick=()=>go({name:'dash'});
  app.querySelector('.star').onclick=e=>{ toggleFavorite(sid); e.target.textContent=favorites.has(sid)?'★':'☆'; };
  const bind=(id,k)=>document.getElementById(id).addEventListener(id==='q'?'input':'change',e=>{F[k]=e.target.value;binderPage=0;paint();});
  bind('q','q');bind('rar','rar');bind('vf','vf');bind('st','st');
  document.getElementById('vt').querySelectorAll('button').forEach(b=>b.onclick=()=>{ cardView=b.dataset.view; localStorage.setItem('ms_view',cardView); binderPage=0; syncToggle(); paint(); });
  function syncToggle(){ document.getElementById('vt').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===cardView)); }
  syncToggle();

  function updateHero(prevPct){
    const own=oset().size,tot=data.totalSlots||0,p=tot?Math.round(own/tot*100):0;
    const cN=data.rows.filter(cardHasAny).length,cT=data.rows.length,cp=cT?Math.round(cN/cT*100):0;
    document.getElementById('pct').textContent=p+'%'; document.getElementById('ring').style.setProperty('--pct',p);
    document.getElementById('pmst').textContent=p+'%'; document.getElementById('bmst').style.width=p+'%';
    document.getElementById('pcpl').textContent=cp+'%'; document.getElementById('bcpl').style.width=cp+'%';
    const v=ownedValue(); document.getElementById('ov').textContent=money(v); syncValue(sid,v);
    const ring=document.getElementById('ring'); ring.classList.toggle('done',p>=100);
    if(p>=100 && prevPct!=null && prevPct<100 && !celebrated[sid]){ celebrated[sid]=true; ring.classList.add('cel'); setTimeout(()=>ring.classList.remove('cel'),1200); confetti(); toast('🎉 Master set completo!'); }
  }
  function filtered(){
    return data.rows.filter(r=>{
      if(F.rar&&r.rarity!==F.rar)return false;
      if(F.vf){ if(F.vf==='__ball'){ if(!r.variants.some(v=>VAR[v].grp==='ball'))return false; } else if(!r.variants.includes(F.vf))return false; }
      if(F.st==='done'&&!cardDone(r))return false; if(F.st==='miss'&&cardDone(r))return false;
      if(F.q){const h=(r.name+' '+r.number).toLowerCase(); if(!h.includes(F.q.toLowerCase()))return false;} return true;
    });
  }
  function chips(r){ return r.variants.map(v=>{const on=oset().has(sk(r.id,v));const m=VAR[v];return '<span class="v '+m.cls+(on?' on':'')+'" data-id="'+esc(r.id)+'" data-v="'+v+'" title="'+m.lbl+'"><span class="dot"></span>'+m.short+'</span>';}).join(''); }
  function gridHTML(list){ return '<div class="grid">'+list.map(r=>{const img=r.img?'<img loading="lazy" src="'+r.img+'">':'<div class="na">sem imagem</div>';const fv=cardFullValue(r);
    return '<div class="c'+(cardDone(r)?' done':cardHasAny(r)?'':' none')+'" data-id="'+esc(r.id)+'"><div class="c-img"><span class="pg">'+esc(r.number)+'</span><span class="cprog tnum">'+cardN(r)+'/'+r.variants.length+'</span><span class="donebadge">✓ Completa</span>'+img+'</div><div class="c-b"><div class="c-name">'+esc(r.name)+'</div><div class="c-meta">'+esc(r.rarity)+(fv?' · <span class="mv">'+money(fv)+'</span>':'')+'</div><div class="vlist">'+chips(r)+'</div></div></div>';
  }).join('')+'</div>'; }
  function tableHTML(list){ return '<div class="tbl">'+list.map(r=>'<div class="trow'+(cardDone(r)?' done':'')+'" data-id="'+esc(r.id)+'"><span class="tn tnum">'+esc(r.number)+'</span><span class="tnm">'+esc(r.name)+' <small>'+esc(r.rarity)+'</small></span><span class="tv tnum">'+money(cardFullValue(r))+'</span><div class="vlist">'+chips(r)+'</div></div>').join('')+'</div>'; }
  function binderHTML(list){ const per=9,pages=Math.max(1,Math.ceil(list.length/per)); if(binderPage>=pages)binderPage=pages-1; const pg=list.slice(binderPage*per,binderPage*per+per);
    let h='<div class="binder"><div class="bpage">'+pg.map(r=>{const img=r.img?'<img src="'+r.img+'">':'';return '<div class="pocket'+(cardHasAny(r)?'':' none')+'" data-id="'+esc(r.id)+'"><div class="pk-img"><span class="pk-n">'+esc(r.number)+'</span>'+img+'</div><div class="vlist">'+chips(r)+'</div></div>';}).join('')+'</div>';
    h+='<div class="bpager"><button data-bp="-1"'+(binderPage<=0?' disabled':'')+'>‹</button><span class="pp">Página '+(binderPage+1)+' / '+pages+'</span><button data-bp="1"'+(binderPage>=pages-1?' disabled':'')+'>›</button></div></div>'; return h; }

  function paint(){
    const list=filtered(); document.getElementById('cl').textContent=list.length+' de '+data.rows.length+' cartas';
    const area=document.getElementById('area');
    if(!list.length){ area.innerHTML='<div class="empty">Nada com esses filtros.</div>'; updateHero(); return; }
    area.innerHTML= cardView==='table'?tableHTML(list) : cardView==='binder'?binderHTML(list) : gridHTML(list);
    updateHero();
  }
  function openCardModal(r){
    const m=document.getElementById('cardmodal'); let dirty=false;
    function esckey(e){ if(e.key==='Escape')close(); }
    function close(){ m.classList.remove('on'); m.onclick=null; document.removeEventListener('keydown',esckey); if(dirty)paint(); }
    const vhtml=()=>r.variants.map(v=>{const on=oset().has(sk(r.id,v));const mm=VAR[v];const pr=r.p&&r.p[v];return '<button class="cmv '+mm.cls+(on?' on':'')+'" data-v="'+v+'"><span class="dot"></span><span class="cmv-l">'+mm.lbl+'</span><span class="cmv-p">'+(pr!=null?money(pr):'')+'</span></button>';}).join('');
    m.querySelector('.cm-box').innerHTML='<div class="cm-img">'+(r.img?'<img src="'+r.img+'" alt="">':'<span style="color:var(--dim)">sem imagem</span>')+'</div>'
      +'<div class="cm-info"><button class="cm-x" id="cmx">✕</button><h3>'+esc(r.name)+'</h3>'
      +'<div class="cm-meta">'+esc(nameOf(meta)||data.setName)+' · Nº '+esc(r.number)+'</div>'
      +'<div class="cm-tags"><span>'+esc(r.rarity||'—')+'</span>'+(r.artist?'<span>🎨 '+esc(r.artist)+'</span>':'')+'</div>'
      +'<div class="cm-vt" id="cmvt">Variações — '+cardN(r)+'/'+r.variants.length+'</div><div class="cm-vlist">'+vhtml()+'</div>'
      +'<div class="cm-val">Valor do card: <b>'+money(cardFullValue(r))+'</b></div></div>';
    m.querySelector('#cmx').onclick=close;
    m.querySelectorAll('.cmv').forEach(b=>b.onclick=()=>{ const v=b.dataset.v; const prev=data.totalSlots?Math.round(oset().size/data.totalSlots*100):0; toggleSlot(sid,sk(r.id,v)); b.classList.toggle('on'); m.querySelector('#cmvt').textContent='Variações — '+cardN(r)+'/'+r.variants.length; updateHero(prev); dirty=true; });
    m.classList.add('on'); m.onclick=e=>{ if(e.target===m)close(); }; document.addEventListener('keydown',esckey);
  }
  document.getElementById('area').addEventListener('click',ev=>{
    const bp=ev.target.closest('[data-bp]'); if(bp){ binderPage+=(+bp.dataset.bp); paint(); return; }
    const el=ev.target.closest('.v');
    if(el){ ev.stopPropagation();
      const id=el.dataset.id,v=el.dataset.v,prev=data.totalSlots?Math.round(oset().size/data.totalSlots*100):0;
      toggleSlot(sid,sk(id,v)); el.classList.toggle('on');
      const r=data.rows.find(x=>x.id===id); const cont=el.closest('.c,.trow,.pocket');
      if(cont){ cont.classList.toggle('done',cardDone(r)); if(cont.classList.contains('c')||cont.classList.contains('pocket'))cont.classList.toggle('none',!cardHasAny(r)); const cp=cont.querySelector('.cprog'); if(cp)cp.textContent=cardN(r)+'/'+r.variants.length; }
      updateHero(prev); if(F.st)paint(); return; }
    const host=ev.target.closest('[data-id]'); if(host){ const r=data.rows.find(x=>x.id===host.dataset.id); if(r)openCardModal(r); }
  });
  paint();
}
</script>
</body>
