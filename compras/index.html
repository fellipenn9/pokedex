<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Controle de Compras — Leilão</title>
<style>
:root{--bg:#0f1424;--surface:#1a2440;--surface2:#1c2749;--line:#2b3a5e;--line2:#3a4d75;--hair:rgba(255,255,255,.06);
  --text:#eaf0fb;--dim:#93a4c4;--accent:#ff4d6d;--accent2:#ff85a1;--gold:#ffce45;--green:#28d08a;--red:#ff5d6b;--radius:14px;--shadow:0 12px 34px -12px rgba(0,0,0,.6)}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--text);min-height:100vh;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(1100px 460px at 50% -220px, rgba(255,206,69,.08), transparent 70%),linear-gradient(180deg,#0f1424,#0b0f1c)}
button{font-family:inherit}
.tnum{font-variant-numeric:tabular-nums}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:11px 18px;background:rgba(15,20,36,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.05rem}
.brand .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--gold),var(--accent));display:flex;align-items:center;justify-content:center;font-size:1rem;box-shadow:var(--shadow)}
.brand b{color:var(--gold)}.sp{flex:1}
.acct{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 6px 4px 12px}
.acct .nm{font-size:.82rem;font-weight:600;color:var(--dim);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct .avatar{width:30px;height:30px;border-radius:50%;border:1px solid var(--line2);object-fit:cover}
.acct .out{border:none;background:var(--surface2);color:var(--dim);width:30px;height:30px;border-radius:50%;cursor:pointer}
.acct .out:hover{background:var(--accent);color:#fff}
@media(max-width:560px){.acct .nm{display:none}}
.wrap{max-width:1400px;margin:0 auto;padding:20px 18px 90px}
.btn{border:1px solid var(--line2);background:var(--surface);color:var(--text);border-radius:11px;padding:9px 14px;font-size:.85rem;font-weight:700;cursor:pointer;transition:all .12s}
.btn:hover{border-color:var(--dim)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff}
.login{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding:20px}
.login .big{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,var(--gold),var(--accent));display:flex;align-items:center;justify-content:center;font-size:2.2rem;box-shadow:var(--shadow)}
.login h1{font-size:1.9rem;margin:0}.login p{color:var(--dim);max-width:440px;line-height:1.5;margin:0}
/* summary */
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}
.card .lbl{font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);font-weight:700}
.card .val{font-size:1.7rem;font-weight:800;margin-top:5px;line-height:1}
.card .sub{font-size:.75rem;color:var(--dim);margin-top:6px}
.pos{color:var(--green)}.neg{color:var(--red)}.gold{color:var(--gold)}
/* toolbar */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select{padding:10px 13px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--text);font-size:.85rem}
.toolbar input.search{flex:1;min-width:170px}
.toolbar input:focus,.toolbar select:focus{outline:none;border-color:var(--accent)}
/* table */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:820px;font-size:.85rem}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--surface2);color:var(--dim);font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0}
tbody tr:hover{background:rgba(255,255,255,.03)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.stg{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);border-radius:99px;padding:3px 10px;font-size:.72rem;font-weight:700;cursor:pointer}
.stg.recebido{color:var(--green);border-color:rgba(40,208,138,.5);background:rgba(40,208,138,.12)}
.stg.estoque{color:var(--gold);border-color:rgba(255,206,69,.5);background:rgba(255,206,69,.12)}
.rowbtn{background:none;border:none;color:var(--dim);cursor:pointer;font-size:1rem;padding:2px 6px;border-radius:6px}
.rowbtn:hover{color:var(--text);background:rgba(255,255,255,.08)}
.empty{color:var(--dim);text-align:center;padding:44px 16px;line-height:1.6}
/* modal */
.mov{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(6,9,18,.72);backdrop-filter:blur(6px)}
.mov.on{display:flex}
.mbox{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--surface);border:1px solid var(--line2);border-radius:18px;box-shadow:var(--shadow);padding:20px}
.mbox.wide{max-width:900px}
.mbox h3{margin:0 0 14px;font-size:1.2rem;font-weight:800}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.fld label{font-size:.75rem;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.fld input,.fld select,.fld textarea{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--text);font-size:.9rem}
.fld textarea{min-height:150px;font-family:ui-monospace,monospace;font-size:.82rem}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.hint{font-size:.78rem;color:var(--dim);line-height:1.5;margin:-4px 0 12px}
.ptable{width:100%;border-collapse:collapse;font-size:.8rem}
.ptable th,.ptable td{padding:5px 6px;border-bottom:1px solid var(--line)}
.ptable input,.ptable select{width:100%;padding:6px 7px;border:1px solid var(--line);border-radius:7px;background:var(--surface2);color:var(--text);font-size:.8rem}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(10px);background:var(--surface2);border:1px solid var(--line2);color:#fff;padding:10px 18px;border-radius:99px;font-size:.84rem;font-weight:600;z-index:80;opacity:0;transition:all .25s;pointer-events:none;box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{text-align:center;color:var(--dim);padding:60px}
@media(max-width:600px){.wrap{padding:16px 12px 90px}.frow{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="topbar"><div class="brand"><span class="logo">🧾</span> Controle de <b>Compras</b></div><div class="sp"></div><div id="userbox"></div></div>
<div class="wrap"><div id="app"><div class="loading">Carregando…</div></div></div>
<div class="mov" id="modal"><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:'AIzaSyCofvOU_VGgvYuNMVMdGXFnrZPuBsUBd7k',authDomain:'pokedex-82ba8.firebaseapp.com',projectId:'pokedex-82ba8',storageBucket:'pokedex-82ba8.firebasestorage.app',messagingSenderId:'783841506180',appId:'1:783841506180:web:36a300cf04811ba93be3d1'};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(); const db=firebase.firestore();
try{ db.enablePersistence({synchronizeTabs:true}); }catch(e){}
const googleProvider=new firebase.auth.GoogleAuthProvider();

const CONDS=['NM','M','SP','MP','HP','D','—'];
let user=null, items=[], F={q:'',status:''};
const app=document.getElementById('app'), toastEl=document.getElementById('toast'), modal=document.getElementById('modal'), mbox=document.getElementById('mbox');
function toast(m){ toastEl.textContent=m; toastEl.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>toastEl.classList.remove('on'),1900); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function brl(n){ n=+n||0; return 'R$ '+n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function parseMoney(s){ if(s==null)return 0; s=String(s).replace(/[^\d,.-]/g,''); if(s.indexOf(',')>-1){ s=s.replace(/\./g,'').replace(',','.'); } return parseFloat(s)||0; }
function uid(){ return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const lsKey=()=>'compras_'+(user?user.uid:'anon');
function cacheLocal(){ try{ localStorage.setItem(lsKey(),JSON.stringify(items)); }catch(e){} }
function loadLocal(){ try{ const d=JSON.parse(localStorage.getItem(lsKey())); if(Array.isArray(d))items=d; }catch(e){} }

auth.onAuthStateChanged(async(u)=>{
  user=u; renderUserbox();
  if(!u){ renderLogin(); return; }
  loadLocal(); render();
  const r=db.collection('users').doc(u.uid);
  try{ await r.set({updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true}); }catch(e){}
  r.onSnapshot(snap=>{ const d=snap.data()||{}; if(Array.isArray(d.purchases))items=d.purchases; cacheLocal(); if(!modal.classList.contains('on'))render(); },err=>console.error('snap',err));
});
function renderUserbox(){ const b=document.getElementById('userbox');
  if(user){ b.innerHTML='<div class="acct"><span class="nm">'+esc((user.displayName||user.email||'').split(' ')[0])+'</span><img class="avatar" src="'+esc(user.photoURL||'')+'" referrerpolicy="no-referrer" alt="" onerror="this.style.display=\'none\'"><button class="out" id="logout" title="Sair">⎋</button></div>'; document.getElementById('logout').onclick=()=>auth.signOut(); } else b.innerHTML=''; }
function renderLogin(){ app.innerHTML='<div class="login"><div class="big">🧾</div><h1>Controle de Compras</h1><p>Acompanhe suas compras de leilão: valor pago, o que já recebeu, o que está em estoque e a valorização vs. o preço atual.</p><button class="btn primary" id="login">Entrar com Google</button></div>'; document.getElementById('login').onclick=async()=>{ try{ await auth.signInWithPopup(googleProvider); }catch(e){ toast('Falha no login'); } }; }

function ref(){ return db.collection('users').doc(user.uid); }
async function persist(){ cacheLocal(); try{ await ref().set({purchases:items},{merge:true}); }catch(e){ toast('Erro ao salvar'); } }

// ---------- render ----------
function totals(){
  let inv=0,cur=0,estoqueV=0,rec=0,est=0;
  items.forEach(it=>{ const q=+it.qty||1, p=(+it.paid||0)*q, c=(+it.cur||0)*q; inv+=p; cur+=c; if(it.status==='recebido')rec++; else { est++; estoqueV+=p; } });
  return {inv,cur,estoqueV,rec,est,lucro:cur-inv,pct:inv?((cur-inv)/inv*100):0};
}
function render(){
  if(!user){ renderLogin(); return; }
  const t=totals();
  const dlt=t.lucro>=0?'pos':'neg', sign=t.lucro>=0?'+':'';
  let h='<div class="sum">'
    +'<div class="card"><div class="lbl">Total investido</div><div class="val tnum">'+brl(t.inv)+'</div><div class="sub">'+items.length+' item(ns)</div></div>'
    +'<div class="card"><div class="lbl">Valor atual (Liga)</div><div class="val tnum gold">'+brl(t.cur)+'</div><div class="sub">preço atual estimado</div></div>'
    +'<div class="card"><div class="lbl">Lucro / Prejuízo</div><div class="val tnum '+dlt+'">'+sign+brl(t.lucro)+'</div><div class="sub '+dlt+'">'+sign+t.pct.toFixed(1)+'%</div></div>'
    +'<div class="card"><div class="lbl">Em estoque (a receber)</div><div class="val tnum">'+brl(t.estoqueV)+'</div><div class="sub">'+t.est+' em estoque · '+t.rec+' recebido(s)</div></div>'
    +'</div>';
  h+='<div class="toolbar"><input class="search" id="q" placeholder="Buscar carta…" value="'+esc(F.q)+'">'
    +'<select id="fst"><option value="">Todos status</option><option value="estoque">Em estoque</option><option value="recebido">Recebidos</option></select>'
    +'<button class="btn primary" id="add">+ Adicionar</button><button class="btn" id="paste">Colar / Importar</button><button class="btn" id="exp">⬇ Exportar</button></div>';
  let list=items.filter(it=>{ if(F.status&&it.status!==F.status)return false; if(F.q&&!(it.card||'').toLowerCase().includes(F.q.toLowerCase()))return false; return true; });
  if(!items.length){ h+='<div class="empty">Nenhuma compra ainda.<br>Use <b>+ Adicionar</b> ou <b>Colar / Importar</b> para começar.</div>'; }
  else{
    h+='<div class="tblwrap"><table><thead><tr><th>Carta</th><th>Cond.</th><th class="num">Qtd</th><th class="num">Pago (un)</th><th class="num">Atual (un)</th><th class="num">Δ%</th><th>Status</th><th></th></tr></thead><tbody>';
    h+=list.map(it=>{ const paid=+it.paid||0,cur=+it.cur||0,d=paid?((cur-paid)/paid*100):0,dc=d>=0?'pos':'neg';
      return '<tr data-id="'+it.id+'"><td>'+esc(it.card||'')+(it.set?' <span style="color:var(--dim)">· '+esc(it.set)+'</span>':'')+'</td>'
        +'<td>'+esc(it.cond||'—')+'</td><td class="num">'+(+it.qty||1)+'</td><td class="num">'+brl(paid)+'</td>'
        +'<td class="num">'+(cur?brl(cur):'—')+'</td><td class="num '+(cur?dc:'')+'">'+(cur?(d>=0?'+':'')+d.toFixed(0)+'%':'—')+'</td>'
        +'<td><span class="stg '+(it.status==='recebido'?'recebido':'estoque')+'" data-st="'+it.id+'">'+(it.status==='recebido'?'✓ Recebido':'📦 Em estoque')+'</span></td>'
        +'<td style="text-align:right"><button class="rowbtn" data-edit="'+it.id+'" title="Editar">✎</button><button class="rowbtn" data-del="'+it.id+'" title="Excluir">🗑</button></td></tr>';
    }).join('')+'</tbody></table></div>';
    if(!list.length) h+='<div class="empty">Nada com esse filtro.</div>';
  }
  app.innerHTML=h;
  document.getElementById('q').addEventListener('input',e=>{F.q=e.target.value; renderRows();});
  document.getElementById('fst').value=F.status; document.getElementById('fst').addEventListener('change',e=>{F.status=e.target.value; renderRows();});
  document.getElementById('add').onclick=()=>openEdit(null);
  document.getElementById('paste').onclick=openPaste;
  document.getElementById('exp').onclick=exportCSV;
  wireRows();
}
function renderRows(){ render(); }
function wireRows(){
  app.querySelectorAll('[data-st]').forEach(el=>el.onclick=()=>{ const it=items.find(x=>x.id===el.dataset.st); if(!it)return; it.status=it.status==='recebido'?'estoque':'recebido'; persist(); render(); });
  app.querySelectorAll('[data-edit]').forEach(el=>el.onclick=()=>openEdit(el.dataset.edit));
  app.querySelectorAll('[data-del]').forEach(el=>el.onclick=()=>{ const it=items.find(x=>x.id===el.dataset.del); if(!it)return; if(confirm('Excluir "'+(it.card||'')+'"?')){ items=items.filter(x=>x.id!==el.dataset.del); persist(); render(); } });
}
function closeModal(){ modal.classList.remove('on'); }
modal.onclick=e=>{ if(e.target===modal)closeModal(); };

// ---------- add/edit ----------
function openEdit(id){
  const it=id?items.find(x=>x.id===id):{id:uid(),card:'',set:'',cond:'NM',qty:1,paid:0,cur:0,status:'estoque',date:today(),hist:[]};
  const isNew=!id;
  mbox.className='mbox';
  mbox.innerHTML='<h3>'+(isNew?'Adicionar compra':'Editar compra')+'</h3>'
    +'<div class="fld"><label>Carta</label><input id="e-card" value="'+esc(it.card)+'" placeholder="Ex.: Charizard ex (223/197)"></div>'
    +'<div class="frow"><div class="fld"><label>Set / Edição</label><input id="e-set" value="'+esc(it.set||'')+'"></div>'
    +'<div class="fld"><label>Condição</label><select id="e-cond">'+CONDS.map(c=>'<option'+(it.cond===c?' selected':'')+'>'+c+'</option>').join('')+'</select></div></div>'
    +'<div class="frow"><div class="fld"><label>Qtd</label><input id="e-qty" type="number" min="1" value="'+(+it.qty||1)+'"></div>'
    +'<div class="fld"><label>Valor pago (un)</label><input id="e-paid" inputmode="decimal" value="'+(it.paid||'')+'"></div></div>'
    +'<div class="frow"><div class="fld"><label>Valor atual Liga (un)</label><input id="e-cur" inputmode="decimal" value="'+(it.cur||'')+'"></div>'
    +'<div class="fld"><label>Status</label><select id="e-status"><option value="estoque"'+(it.status!=='recebido'?' selected':'')+'>📦 Em estoque</option><option value="recebido"'+(it.status==='recebido'?' selected':'')+'>✓ Recebido</option></select></div></div>'
    +'<div class="mact"><button class="btn" id="e-cancel">Cancelar</button><button class="btn primary" id="e-save">Salvar</button></div>';
  modal.classList.add('on');
  mbox.querySelector('#e-cancel').onclick=closeModal;
  mbox.querySelector('#e-save').onclick=()=>{
    const g=id=>mbox.querySelector('#'+id);
    const rec={id:it.id,card:g('e-card').value.trim(),set:g('e-set').value.trim(),cond:g('e-cond').value,
      qty:+g('e-qty').value||1,paid:parseMoney(g('e-paid').value),cur:parseMoney(g('e-cur').value),
      status:g('e-status').value,date:it.date||today(),hist:it.hist||[]};
    if(!rec.card){ toast('Informe a carta'); return; }
    // snapshot de histórico se o valor atual mudou
    const prev=id?(+it.cur||0):0; if(rec.cur&&rec.cur!==prev){ rec.hist=(rec.hist||[]).concat([{d:today(),v:rec.cur}]); }
    if(id){ items=items.map(x=>x.id===id?rec:x); } else { items=items.concat([rec]); }
    persist(); closeModal(); render();
  };
}

// ---------- paste/import ----------
let pasteRows=[];
function openPaste(){
  mbox.className='mbox wide';
  mbox.innerHTML='<h3>Colar / Importar compras</h3>'
    +'<div class="hint">Cole a lista (uma carta por linha). Se copiar de uma tabela, as colunas separadas por TAB são detectadas. Cada linha vira uma compra editável abaixo — ajuste e confirme.</div>'
    +'<div class="fld"><textarea id="p-text" placeholder="Ex.:\nCharizard ex (223/197)\tNM\t250,00\nPikachu (58/102)\tSP\t40,00"></textarea></div>'
    +'<div class="mact"><button class="btn" id="p-parse">Pré-visualizar</button></div>'
    +'<div id="p-prev"></div>';
  modal.classList.add('on');
  mbox.querySelector('#p-parse').onclick=()=>{ pasteRows=parsePaste(mbox.querySelector('#p-text').value); drawPreview(); };
}
function fixEnc(s){ return String(s||'')
  .replace(/edi�+o/gi,'edição').replace(/celebra�+es/gi,'celebrações')
  .replace(/f�mea/gi,'Fêmea').replace(/�+/g,''); }
function parsePaste(text){
  // formato ManinTCG: "Carta<TAB>Valor" (cabeçalho repete; linhas às vezes grudam).
  // Estratégia: quebrar pelos valores "R$ x,xx" (dotall pega mesmo sem \n).
  let t=fixEnc(text).replace(/Carta\s*\t?\s*Valor/gi,'\n');
  const rows=[]; const re=/([\s\S]*?)R\$\s*([\d.]+,\d{2})/g; let m;
  while((m=re.exec(t))){
    let card=m[1].replace(/\t/g,' ').replace(/\s+/g,' ').trim();
    if(!card) continue;
    const paid=parseMoney(m[2]);
    let cond='—'; const cm=card.match(/\s(NM|MP\+?|SP\+?|HP\+?|D\+?|PL|M)\s*$/i);
    if(cm){ cond=cm[1].toUpperCase(); card=card.slice(0,cm.index).trim(); }
    rows.push({card,cond,qty:1,paid,status:'estoque'});
  }
  return rows;
}
function drawPreview(){
  const el=mbox.querySelector('#p-prev');
  if(!pasteRows.length){ el.innerHTML='<div class="hint">Nada reconhecido. Cole a lista e clique em Pré-visualizar.</div>'; return; }
  el.innerHTML='<div class="hint" style="margin-top:8px">'+pasteRows.length+' linha(s). Ajuste se precisar:</div>'
    +'<div style="overflow:auto;max-height:320px"><table class="ptable"><thead><tr><th>Carta</th><th>Cond.</th><th>Qtd</th><th>Pago</th><th>Status</th></tr></thead><tbody>'
    +pasteRows.map((r,i)=>'<tr><td><input data-i="'+i+'" data-f="card" value="'+esc(r.card)+'"></td>'
      +'<td><select data-i="'+i+'" data-f="cond">'+CONDS.map(c=>'<option'+(r.cond===c?' selected':'')+'>'+c+'</option>').join('')+'</select></td>'
      +'<td><input data-i="'+i+'" data-f="qty" type="number" min="1" value="'+(r.qty||1)+'" style="width:60px"></td>'
      +'<td><input data-i="'+i+'" data-f="paid" value="'+(r.paid||'')+'" style="width:90px"></td>'
      +'<td><select data-i="'+i+'" data-f="status"><option value="estoque"'+(r.status!=='recebido'?' selected':'')+'>Em estoque</option><option value="recebido"'+(r.status==='recebido'?' selected':'')+'>Recebido</option></select></td></tr>').join('')
    +'</tbody></table></div><div class="mact"><button class="btn" id="p-cancel">Cancelar</button><button class="btn primary" id="p-confirm">Importar '+pasteRows.length+'</button></div>';
  el.querySelectorAll('input,select').forEach(inp=>inp.addEventListener('input',e=>{ const i=+e.target.dataset.i,f=e.target.dataset.f; pasteRows[i][f]=f==='paid'?e.target.value:(f==='qty'?+e.target.value:e.target.value); }));
  el.querySelector('#p-cancel').onclick=closeModal;
  el.querySelector('#p-confirm').onclick=()=>{
    const add=pasteRows.filter(r=>(r.card||'').trim()).map(r=>({id:uid(),card:r.card.trim(),set:'',cond:r.cond||'NM',qty:+r.qty||1,paid:parseMoney(r.paid),cur:0,status:r.status||'estoque',date:today(),hist:[]}));
    if(!add.length){ toast('Nada para importar'); return; }
    items=items.concat(add); persist(); closeModal(); render(); toast(add.length+' compra(s) importada(s)');
  };
}

// ---------- export ----------
function exportCSV(){
  if(!items.length){ toast('Nada para exportar'); return; }
  const rows=[['Carta','Set','Condição','Qtd','Valor pago (un)','Valor atual (un)','Δ%','Status','Data']];
  items.forEach(it=>{ const paid=+it.paid||0,cur=+it.cur||0,d=paid?((cur-paid)/paid*100):0;
    rows.push([it.card||'',it.set||'',it.cond||'',(+it.qty||1),paid.toFixed(2),cur?cur.toFixed(2):'',cur?d.toFixed(0)+'%':'',it.status==='recebido'?'Recebido':'Em estoque',it.date||'']); });
  const csv='﻿'+rows.map(r=>r.map(c=>{ c=String(c); return /[";\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c; }).join(';')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='compras.csv'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1500);
  toast('Exportado');
}
</script>
